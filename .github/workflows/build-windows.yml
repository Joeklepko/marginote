name: Build Windows .exe

on:
  push:
    branches: [dev]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 给 softprops/action-gh-release 创建 Release 用

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust deps
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'desktop/src-tauri -> target'

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Check shared JavaScript and generated extension cores
        run: npm run check

      - name: Test shared JavaScript logic
        run: npm run test:js

      - name: Check Rust formatting
        shell: bash
        run: |
          cargo fmt --manifest-path desktop/cli/Cargo.toml -- --check
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Test CLI
        run: cargo test --manifest-path desktop/cli/Cargo.toml

      - name: Prepare CLI sidecar for desktop checks
        working-directory: desktop
        run: npm run build:cli

      - name: Test desktop bridge
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Lint Rust workspaces
        shell: bash
        run: |
          cargo clippy --manifest-path desktop/cli/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Generate icons (if missing)
        working-directory: desktop
        shell: pwsh
        run: |
          if (-not (Test-Path src-tauri/icons/icon.ico)) {
            npm exec tauri -- icon ../shared/icons/icon128.png -o src-tauri/icons
          }

      - name: Build Tauri app
        working-directory: desktop
        run: npm run build

      - name: Add standalone CLI asset
        shell: pwsh
        run: Copy-Item desktop/src-tauri/binaries/marginote-cli-x86_64-pc-windows-msvc.exe desktop/src-tauri/target/release/bundle/nsis/marginote-cli.exe

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: marginote-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
          generate_release_notes: true

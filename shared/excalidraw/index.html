<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginote · 画图</title>
<!-- Excalidraw 自托管资源已内置在 ./vendor/（随仓库与安装包一起分发，无需联网、
     无需运行任何脚本）。扩展 MV3 与桌面 Tauri 的 CSP 都是 script-src 'self'，
     所以脚本必须本地化、且不能内联（内联会被 MV3 拦截）—— 引导与主逻辑分别放在
     boot.js / app.js。0.17.x 的样式由 JS 注入（无独立 CSS 文件），style-src 允许
     'unsafe-inline'，故此处不再引用 vendor/*.css。 -->
<style>
  html, body { height: 100%; margin: 0; }
  /* canvas 必须有确定高度，否则 Excalidraw 工具栏（绝对定位）能显示但
     画布区域高度为 0 → 看似打开实则无法编辑。用 absolute fill 固定尺寸。 */
  #root { position: absolute; inset: 0; }
  body { font-family: system-ui, -apple-system, 'Microsoft YaHei', sans-serif; }
  #setup-hint {
    display: none;
    position: absolute; inset: 0;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; padding: 40px;
    text-align: center; color: #444; background: #faf6ed; z-index: 10;
  }
  #setup-hint.show { display: flex; }
  #setup-hint h2 { margin: 0; font-size: 18px; }
  #setup-hint code {
    background: #ece5d6; padding: 2px 8px; border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  }
  #setup-detail { font-size: 12px; color: #b8431f; max-width: 560px; word-break: break-all; }
</style>
</head>
<body>
<div id="root"></div>
<div id="setup-hint">
  <h2>画图资源未就绪</h2>
  <p>Excalidraw 资源已内置在安装包/扩展内，正常情况下无需任何操作。</p>
  <p>若出现此提示，通常是安装包或扩展未完整解压；请重新安装，或重新加载扩展。</p>
  <div id="setup-detail"></div>
</div>

<!-- 加载顺序：boot.js（process 垫片 + 资源路径 + 错误捕获）必须最先；
     再按序加载 react → react-dom → excalidraw；最后 app.js 启动画板。 -->
<script src="./boot.js"></script>
<script src="./vendor/react.production.min.js"></script>
<script src="./vendor/react-dom.production.min.js"></script>
<script src="./vendor/excalidraw.production.min.js"></script>
<script src="./app.js"></script>
</body>
</html>

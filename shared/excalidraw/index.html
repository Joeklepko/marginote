<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marginote · 画图</title>
<!-- Excalidraw 自托管资源（由 vendor/fetch.sh 下载到 ./vendor/）。
     扩展 MV3 与桌面 Tauri 的 CSP 都是 script-src 'self'，所以必须本地化，
     不能用 CDN。缺资源时下方脚本会显示提示而非白屏。 -->
<link rel="stylesheet" href="./vendor/excalidraw.css" onerror="window.__cssFail=true">
<style>
  html, body, #root { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, 'Microsoft YaHei', sans-serif; }
  #setup-hint {
    display: none;
    position: absolute; inset: 0;
    align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; padding: 40px;
    text-align: center; color: #444; background: #faf6ed;
  }
  #setup-hint.show { display: flex; }
  #setup-hint h2 { margin: 0; font-size: 18px; }
  #setup-hint code {
    background: #ece5d6; padding: 2px 8px; border-radius: 4px;
    font-family: ui-monospace, Consolas, monospace; font-size: 13px;
  }
  #setup-hint pre {
    text-align: left; background: #1a1814; color: #f4efe6;
    padding: 14px 18px; border-radius: 8px; font-size: 13px;
    max-width: 560px; overflow-x: auto;
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="setup-hint">
  <h2>Excalidraw 画图资源未安装</h2>
  <p>这是一次性安装（约 3MB，需要联网下载一次，之后离线可用）。</p>
  <p>在项目根目录运行：</p>
  <pre>cd shared/excalidraw/vendor &amp;&amp; bash fetch.sh</pre>
  <p style="font-size:13px;color:#888;">扩展端会随 <code>shared/</code> 一并同步到 <code>extension/</code>。</p>
</div>

<!-- 本地 React + Excalidraw UMD（fetch.sh 下载）。缺失则 onerror 触发提示。 -->
<script>window.__assetFail = false;</script>
<script src="./vendor/react.production.min.js" onerror="window.__assetFail=true"></script>
<script src="./vendor/react-dom.production.min.js" onerror="window.__assetFail=true"></script>
<script src="./vendor/excalidraw.production.min.js" onerror="window.__assetFail=true"></script>
<script>
(function () {
  'use strict';

  // 资源缺失 → 显示安装提示，不白屏
  function assetsReady() {
    return !window.__assetFail
      && typeof window.React !== 'undefined'
      && typeof window.ReactDOM !== 'undefined'
      && typeof window.ExcalidrawLib !== 'undefined';
  }
  if (!assetsReady()) {
    document.getElementById('setup-hint').classList.add('show');
    // 仍然回告父窗口，父窗口可据此提示用户
    try { parent.postMessage({ source: 'mn-excalidraw', type: 'assets-missing' }, '*'); } catch (e) {}
    return;
  }

  const { Excalidraw, serializeAsJSON } = window.ExcalidrawLib;
  let excalidrawAPI = null;
  let pendingScene = null;   // 父窗口在 ready 之前发来的场景
  let saveTimer = null;

  function postToParent(msg) {
    try { parent.postMessage(Object.assign({ source: 'mn-excalidraw' }, msg), '*'); } catch (e) {}
  }

  function currentSceneJSON() {
    if (!excalidrawAPI) return '';
    try {
      return serializeAsJSON(
        excalidrawAPI.getSceneElements(),
        excalidrawAPI.getAppState(),
        excalidrawAPI.getFiles(),
        'local'
      );
    } catch (e) { return ''; }
  }

  function loadSceneJSON(json) {
    if (!excalidrawAPI) { pendingScene = json; return; }
    try {
      const data = (json && json.trim()) ? JSON.parse(json) : { elements: [], appState: {} };
      excalidrawAPI.updateScene({
        elements: data.elements || [],
        appState: Object.assign({}, data.appState || {}, { collaborators: [] }),
      });
      if (data.files && Object.keys(data.files).length) {
        const arr = Object.keys(data.files).map(k => data.files[k]);
        try { excalidrawAPI.addFiles(arr); } catch (e) {}
      }
      try { excalidrawAPI.scrollToContent(); } catch (e) {}
    } catch (e) {
      postToParent({ type: 'error', message: 'load scene failed: ' + (e && e.message) });
    }
  }

  // 父 → iframe 消息
  window.addEventListener('message', function (ev) {
    const d = ev.data;
    if (!d || d.target !== 'mn-excalidraw') return;
    if (d.type === 'load') loadSceneJSON(d.json || '');
    else if (d.type === 'request-save') postToParent({ type: 'scene', json: currentSceneJSON() });
  });

  function onChange() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      postToParent({ type: 'scene', json: currentSceneJSON() });
    }, 800);
  }

  function isDark() {
    try { return new URLSearchParams(location.search).get('theme') === 'dark'; }
    catch (e) { return false; }
  }

  const e = window.React.createElement;
  function App() {
    return e(Excalidraw, {
      initialData: pendingScene ? safeParse(pendingScene) : null,
      excalidrawAPI: function (api) {
        excalidrawAPI = api;
        if (pendingScene) { loadSceneJSON(pendingScene); pendingScene = null; }
        postToParent({ type: 'ready' });
      },
      onChange: onChange,
      theme: isDark() ? 'dark' : 'light',
      langCode: 'zh-CN',
    });
  }
  function safeParse(j) { try { return JSON.parse(j); } catch (e) { return null; } }

  window.ReactDOM.createRoot(document.getElementById('root')).render(e(App));
})();
</script>
</body>
</html>

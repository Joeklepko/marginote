    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.04em;
    margin-top: 2px;
  }
  .todo-remind-row .bell {
    flex-shrink: 0;
    color: var(--accent);
  }
  .todo-remind-row input[type="number"] {
    width: 48px;
    padding: 4px 6px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink);
    outline: none;
    text-align: center;
  }
  .todo-remind-row input[type="number"]:focus { border-color: var(--ink-soft); }
  .todo-remind-row input[type="number"]::-webkit-inner-spin-button { opacity: 0.4; }

  .ext-only-tip {
    display: none;
    font-style: italic;
    color: var(--ink-mute);
    font-size: 10px;
    margin-top: 4px;
  }
  body:not(.is-ext) .ext-only-tip { display: block; }
  body:not(.is-ext) .todo-remind-row { opacity: 0.55; }

  /* ====== 存储 / 备份 模态框 ====== */
  .storage-info {
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 14px 16px;
    margin-bottom: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    line-height: 1.7;
    word-break: break-all;
  }
  .storage-info .key { color: var(--ink-mute); display: inline-block; min-width: 90px; }
  .storage-info .val { color: var(--ink); }

  .storage-actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
  }
  .storage-actions button {
    padding: 10px 14px;
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    border-radius: 6px;
    cursor: pointer;
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--ink);
    transition: all 0.18s;
  }
  .storage-actions button:hover {
    background: var(--paper);
    border-color: var(--ink-soft);
  }

  .storage-auto-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    border-radius: 6px;
    margin-bottom: 8px;
  }
  .storage-auto-row label {
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--ink);
    flex: 1;
  }
  .storage-auto-row input[type="number"] {
    width: 60px;
    padding: 6px 8px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink);
    text-align: center;
  }

  /* ====== AI 优化 ====== */
  .ai-menu {
    position: fixed;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    box-shadow: var(--shadow-deep);
    padding: 6px;
    z-index: 1100;
    min-width: 220px;
    display: none;
  }
  .ai-menu.show { display: block; }
  .ai-menu .ai-menu-title {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    color: var(--ink-mute);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 12px 6px;
  }
  .ai-menu button {
    width: 100%;
    padding: 8px 12px;
    background: transparent;
    border: none;
    text-align: left;
    cursor: pointer;
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--ink);
    border-radius: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .ai-menu button:hover:not(:disabled) { background: var(--bg-warm); }
  .ai-menu button:disabled { color: var(--ink-mute); cursor: not-allowed; }
  .ai-menu .ai-menu-divider { height: 1px; background: var(--rule-soft); margin: 4px 4px; }
  .ai-menu .ai-undo { color: var(--accent); }

  .ai-spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid var(--ink-mute);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: aiSpin 0.7s linear infinite;
    vertical-align: -2px;
  }
  @keyframes aiSpin { to { transform: rotate(360deg); } }

  /* AI 设置 */
  .ai-provider-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
    max-height: 280px;
    overflow-y: auto;
  }
  .ai-provider {
    display: grid;
    grid-template-columns: 22px 1fr auto;
    gap: 10px;
    padding: 10px 12px;
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    border-radius: 8px;
    align-items: center;
  }
  .ai-provider.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184,67,31,0.10);
  }
  .ai-provider input[type="radio"] { margin: 0; cursor: pointer; accent-color: var(--accent); }
  .ai-provider .name {
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--ink);
  }
  .ai-provider .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    margin-top: 2px;
    word-break: break-all;
  }
  .ai-provider-actions { display: flex; gap: 4px; }
  .ai-provider-actions button {
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Fraunces', serif;
    font-size: 11px;
    color: var(--ink-soft);
    transition: all 0.18s;
  }
  .ai-provider-actions button:hover { color: var(--ink); border-color: var(--ink-soft); background: var(--paper); }

  .ai-provider-form {
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    border-radius: 8px;
    padding: 16px;
    display: none;
    margin-bottom: 12px;
  }
  .ai-provider-form.show { display: block; }
  .ai-provider-form .row { margin-bottom: 10px; }
  .ai-provider-form .row.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ai-provider-form label {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .ai-provider-form input, .ai-provider-form textarea, .ai-provider-form select {
    width: 100%;
    padding: 8px 10px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    box-sizing: border-box;
  }
  .ai-provider-form input:focus, .ai-provider-form textarea:focus { border-color: var(--ink-soft); }
  .ai-provider-form textarea { min-height: 60px; resize: vertical; }
  .ai-provider-form .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
  .ai-add-row { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .ai-add-row select {
    flex: 1;
    padding: 8px 10px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-family: 'Fraunces', serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }

  /* AI 工具栏按钮带渐变图标 */
  .tool-btn.ai-btn {
    color: var(--accent);
    position: relative;
  }
  .tool-btn.ai-btn:hover { color: var(--accent-soft); }
  .tool-btn.ai-btn.busy svg { display: none; }
  .tool-btn.ai-btn.busy::after {
    content: '';
    position: absolute;
    inset: 0;
    margin: auto;
    width: 14px;
    height: 14px;
    border: 2px solid var(--ink-mute);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: aiSpin 0.7s linear infinite;
  }
  .icon-btn.ai-btn { color: var(--accent); }
  .icon-btn.ai-btn.busy svg { display: none; }
  .icon-btn.ai-btn.busy::before {
    content: '';
    position: absolute;
    inset: 0;
    margin: auto;
    width: 14px;
    height: 14px;
    border: 2px solid var(--ink-mute);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: aiSpin 0.7s linear infinite;
  }

  /* 主题选择器 */
  .theme-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .theme-card {
    border: 2px solid var(--rule);
    border-radius: 8px;
    padding: 10px 12px;
    cursor: pointer;
    background: var(--bg-warm);
    transition: all 0.18s;
    user-select: none;
  }
  .theme-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184,67,31,0.12);
  }
  .theme-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-soft);
  }
  .theme-card-name {
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--ink);
  }
  .theme-card-swatches {
    display: flex;
    gap: 3px;
    height: 18px;
  }
  .theme-card-swatch {
    flex: 1;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .theme-custom-row {
    display: grid;
    grid-template-columns: 110px 28px 40px 28px 40px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .theme-custom-row .label {
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    text-transform: none;
    letter-spacing: 0;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .theme-custom-row input[type="color"] {
    width: 40px;
    height: 28px;
    border: 1px solid var(--rule);
    border-radius: 4px;
    background: transparent;
    cursor: pointer;
    padding: 1px;
  }
  @media (max-width: 600px) {
    .theme-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* 导入下拉 */
  .import-menu {
    position: fixed;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 8px;
    box-shadow: var(--shadow-deep);
    padding: 6px;
    z-index: 1000;
    min-width: 180px;
    display: none;
  }
  .import-menu.show { display: block; }
  .import-menu button {
    width: 100%;
    padding: 8px 12px;
    background: transparent;
    border: none;
    text-align: left;
    cursor: pointer;
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--ink);
    border-radius: 4px;
  }
  .import-menu button:hover { background: var(--bg-warm); }

  /* ====== a11y focus-visible ====== */
  *:focus { outline: none; }
  button:focus-visible,
  [role="button"]:focus-visible,
  a:focus-visible,
  [tabindex]:not(input):not(textarea):focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 4px;
  }
  input:focus,
  input:focus-visible,
  textarea:focus,
  textarea:focus-visible,
  [contenteditable]:focus,
  [contenteditable]:focus-visible {
    outline: none;
    box-shadow: none;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  /* ====== 排序 / 紧凑控件 ====== */
  .list-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 24px 8px;
    border-bottom: 1px solid var(--rule-soft);
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    letter-spacing: 0.01em;
    -webkit-font-smoothing: antialiased;
  }
  .list-controls select {
    padding: 4px 8px;
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
    outline: none;
  }
  .list-controls .compact-toggle {
    margin-left: auto;
    padding: 4px 10px;
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 100px;
    font-family: inherit;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
    transition: all 0.15s;
  }
  .list-controls .compact-toggle.active {
    background: var(--bg-warm);
    color: var(--ink);
    border-color: var(--ink-soft);
  }
  .sidebar.todo-mode .list-controls { display: none; }

  .note-item.compact { padding: 8px 24px; }
  .note-item.compact .note-preview,
  .note-item.compact .note-foot { display: none; }
  .note-item.compact .note-item-head { margin-bottom: 0; }
  .note-item.compact .note-title { font-size: 13px; }

  .note-item mark, .todo-row mark {
    background: var(--highlight);
    color: var(--ink);
    padding: 0 2px;
    border-radius: 2px;
  }

  /* ====== 提醒预设 ====== */
  .remind-preset-row {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 2px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
  }
  .remind-preset-row select {
    padding: 4px 8px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    outline: none;
    cursor: pointer;
  }
  .remind-advanced {
    display: none;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .remind-advanced.show { display: flex; }
  .remind-advanced input[type="number"] {
    width: 48px;
    padding: 4px 6px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius: 4px;
    font-family: inherit;
    font-size: 11px;
    color: var(--ink);
    outline: none;
    text-align: center;
  }

  /* ====== Outline 大纲面板 ====== */
  .outline-panel {
    position: fixed;
    right: 0;
    top: 56px;
    bottom: 0;
    width: 240px;
    background: var(--bg-warm);
    border-left: 1px solid var(--rule);
    padding: 16px 16px 24px;
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 9;
    overflow-y: auto;
  }
  .outline-panel.show {
    transform: translateX(0);
    box-shadow: -8px 0 24px rgba(0,0,0,0.15);
  }
  .outline-close {
    position: absolute;
    top: 8px;
    right: 10px;
    width: 28px;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--ink-mute);
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    border-radius: 4px;
  }
  .outline-close:hover { background: var(--rule-soft); color: var(--ink); }
  .outline-panel h4 {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-mute);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .outline-item {
    display: block;
    padding: 4px 8px;
    cursor: pointer;
    border-radius: 4px;
    color: var(--ink-soft);
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    line-height: 1.5;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
    transition: all 0.15s;
  }
  .outline-item:hover { background: var(--rule-soft); color: var(--ink); }
  .outline-item.h2 { padding-left: 18px; font-size: 12px; }
  .outline-item.h3 { padding-left: 30px; font-size: 11px; color: var(--ink-mute); }
  .outline-empty { color: var(--ink-mute); font-style: italic; font-size: 12px; padding: 16px 8px; }

  /* ====== Split View ====== */
  .editor-content.split {
    display: grid;
    grid-template-columns: 1fr 1px 1fr;
    gap: 0;
    max-width: none;
    padding: 32px 24px 80px;
    align-items: start;
  }
  .editor-content.split .title-input,
  .editor-content.split .editor-meta,
  .editor-content.split .subtitle-row,
  .editor-content.split .editor-nb-badge {
    grid-column: 1 / -1;
  }
  .editor-content.split .content-input {
    grid-column: 1;
    display: block !important;
    border-right: 1px solid var(--rule-soft);
    padding-right: 16px;
    height: calc(100vh - 220px);
    min-height: 320px;
    overflow-y: auto;
    resize: none;
  }
  .editor-content.split .preview {
    grid-column: 3;
    display: block !important;
    padding-left: 16px;
    height: calc(100vh - 220px);
    min-height: 320px;
    overflow-y: auto;
  }

  /* ====== AI 自定义指令 modal ====== */
  .ai-custom-modal textarea {
    width: 100%;
    min-height: 100px;
    padding: 10px 12px;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 6px;
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
    resize: vertical;
    margin-bottom: 12px;
    box-sizing: border-box;
  }
  .ai-history-list {
    max-height: 140px;
    overflow-y: auto;
    margin-bottom: 12px;
  }
  .ai-history-list .history-item {
    padding: 6px 10px;
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    border-radius: 4px;
    margin-bottom: 4px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    transition: all 0.15s;
  }
  .ai-history-list .history-item:hover { background: var(--paper); color: var(--ink); }

  .ai-cancel-btn {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 100px;
    font-family: 'Fraunces', 'Noto Serif SC', serif;
    font-size: 13px;
    cursor: pointer;
    box-shadow: var(--shadow-deep);
    z-index: 1000;
    display: none;
    gap: 8px;
    align-items: center;
  }
  .ai-cancel-btn.show { display: inline-flex; }

  /* ====== 移动端抽屉 + 底部 tab ====== */
  .mobile-fab, .mobile-tabs { display: none; }
  @media (max-width: 768px) {
    .app { display: block; height: 100vh; }
    .rail {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 56px;
      width: 280px;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
      z-index: 200;
      display: flex !important;
      box-shadow: 8px 0 24px rgba(0,0,0,0.2);
    }
    .app.show-rail .rail { transform: translateX(0); }
    .app.show-rail::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 56px;
      background: rgba(26,24,20,0.5);
      z-index: 150;
    }
    .sidebar { display: flex !important; height: calc(100vh - 56px); width: 100%; }
    .editor { display: none !important; height: calc(100vh - 56px); }
    .app.show-editor .sidebar { display: none !important; }
    .app.show-editor .editor { display: block !important; width: 100%; }
    .mobile-fab {
      display: grid;
      place-items: center;
      position: fixed;
      top: 12px;
      left: 12px;
      width: 40px;
      height: 40px;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 8px;
      box-shadow: var(--shadow-soft);
      z-index: 100;
      cursor: pointer;
    }
    .mobile-fab svg { width: 20px; height: 20px; color: var(--ink); }
    .mobile-tabs {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 56px;
      background: var(--bg-warm);
      border-top: 1px solid var(--rule);
      z-index: 100;
    }
    .mobile-tabs button {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--ink-mute);
      font-family: 'Fraunces', 'Noto Serif SC', serif;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      padding: 6px;
    }
    .mobile-tabs button svg { width: 18px; height: 18px; }
    .mobile-tabs button.active { color: var(--accent); }
    .sidebar-head { padding-left: 60px; }
    .editor-toolbar { flex-wrap: wrap; padding: 10px 16px; gap: 6px; }
    .word-count { display: none; }
    .outline-panel { display: none; }
  }

  /* ====== Toast 详情链接 ====== */
  .toast .detail-link {
    color: var(--accent);
    margin-left: 12px;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ====== 阅读模式（只显示笔记内容）====== */
  .app.reading-mode { grid-template-columns: 1fr !important; }
  .app.reading-mode .rail,
  .app.reading-mode .sidebar,
  .app.reading-mode .editor-toolbar,
  .app.reading-mode .editor-meta,
  .app.reading-mode .subtitle-row,
  .app.reading-mode .editor-nb-badge,
  .app.reading-mode .content-input,
  .app.reading-mode .mobile-fab,
  .app.reading-mode .mobile-tabs,
  .app.reading-mode .outline-panel,
  .app.reading-mode .ai-cancel-btn,
  .app.reading-mode #emptyState { display: none !important; }
  .app.reading-mode .editor {
    width: 100%;
    height: 100vh;
    overflow-y: auto;
  }
  .app.reading-mode .editor-content {
    max-width: 760px;
    margin: 0 auto;
    padding: 80px 32px 160px;
  }
  .app.reading-mode .editor-content.split { display: block; }
  .app.reading-mode .editor-content.split .preview {
    display: block !important;
    border: none;
    padding: 0;
  }
  .app.reading-mode .editor-content.split .content-input { display: none !important; }
  .app.reading-mode .preview { display: block !important; }
  .app.reading-mode .title-input {
    pointer-events: none;
    user-select: text;
    background: transparent;
    margin-bottom: 24px;
  }
  .app.reading-mode .preview { font-size: 18px; line-height: 1.9; }

  .reading-exit-btn {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 200;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--bg-warm);
    border: 1px solid var(--rule);
    cursor: pointer;
    display: none;
    place-items: center;
    color: var(--ink-soft);
    box-shadow: var(--shadow-soft);
    transition: all 0.18s;
  }
  .reading-exit-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .reading-exit-btn svg { width: 16px; height: 16px; }
  .app.reading-mode .reading-exit-btn { display: grid; }

  .reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    height: 3px;
    background: var(--accent);
    z-index: 201;
    width: 0%;
    transition: width 0.1s;
    display: none;
  }
  .app.reading-mode .reading-progress { display: block; }

  /* ====== AI 助手：内嵌右侧编辑区 + 竖列侧栏 ====== */
  #assistantWrap { display: none; flex-direction: column; height: 100%; overflow: hidden; }
  .editor.assistant-active #assistantWrap { display: flex; }
  .editor.assistant-active > *:not(#assistantWrap):not(.reading-exit-btn):not(.reading-progress) { display: none !important; }

  .assistant-topbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; border-bottom: 1px solid var(--rule-soft);
    flex-shrink: 0; background: var(--bg);
  }
  .assistant-title { font-size: 14px; font-weight: 600; color: var(--ink); flex: 1; }
  .assistant-topbar .assistant-back-btn {
    width: 28px; height: 28px; border: 1px solid var(--rule);
    background: var(--paper); border-radius: 6px; cursor: pointer;
    display: grid; place-items: center; color: var(--ink-soft); flex-shrink: 0; transition: all 0.15s;
  }
  .assistant-topbar .assistant-back-btn:hover { color: var(--ink); border-color: var(--ink-soft); }
  .assistant-topbar .assistant-back-btn svg { width: 14px; height: 14px; }

  .assistant-header-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .assistant-header-actions button {
    padding: 4px 10px; font-size: 11px; border: 1px solid var(--rule);
    background: transparent; border-radius: 4px; cursor: pointer;
    color: var(--ink-mute); transition: all 0.15s; white-space: nowrap;
  }
  .assistant-header-actions button:hover { color: var(--ink); border-color: var(--ink-soft); }

  /* 主体：侧栏 + 聊天区 */
  .assistant-body { display: flex; flex: 1; min-height: 0; overflow: hidden; }

  .assistant-sidebar {
    width: 160px; border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; background: var(--bg-warm);
    flex-shrink: 0; overflow: hidden; font-size: 12px;
  }
  .assistant-sidebar-head { padding: 8px 10px; border-bottom: 1px solid var(--rule-soft); }
  .assistant-sidebar-head button {
    width: 100%; padding: 5px 8px; background: var(--paper);
    border: 1px solid var(--rule); border-radius: 5px; cursor: pointer;
    font-size: 11px; color: var(--ink-soft); display: flex; align-items: center;
    gap: 4px; justify-content: center; transition: all 0.12s;
  }
  .assistant-sidebar-head button:hover { color: var(--accent); border-color: var(--accent); background: var(--bg-warm); }
  .assistant-sidebar-head button svg { width: 11px; height: 11px; }

  .assistant-group-list { flex: 1; overflow-y: auto; padding: 4px 0; }
  .assistant-group-item {
    display: flex; align-items: center; gap: 6px; padding: 7px 10px;
    cursor: pointer; transition: all 0.12s; border-left: 3px solid transparent;
    font-size: 12px; color: var(--ink-soft); position: relative;
  }
  .assistant-group-item:hover { background: var(--rule-soft); color: var(--ink); }
  .assistant-group-item.active { background: var(--paper); border-left-color: var(--accent); color: var(--ink); font-weight: 500; }
  .assistant-group-item .group-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .assistant-group-item .group-meta {
    font-size: 9px; color: var(--ink-mute); flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace;
  }
  .assistant-group-item .group-actions { display: none; gap: 2px; flex-shrink: 0; }
  .assistant-group-item:hover .group-actions { display: flex; }
  .assistant-group-item:hover .group-meta { display: none; }
  .assistant-group-item .group-action-btn {
    width: 20px; height: 20px; border: none; background: transparent;
    color: var(--ink-mute); border-radius: 3px; cursor: pointer;
    display: grid; place-items: center; transition: all 0.12s;
  }
  .assistant-group-item .group-action-btn:hover { background: var(--rule); color: var(--ink); }
  .assistant-group-item .group-action-btn svg { width: 10px; height: 10px; }

  .assistant-main { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

  #assistantWrap .assistant-chat {
    flex: 1; overflow-y: auto; padding: 14px 18px;
    display: flex; flex-direction: column; gap: 12px;
    background: var(--bg); min-height: 0;
  }

  #assistantWrap .assistant-attach-row {
    display: flex; align-items: center; gap: 6px;
    padding: 2px 16px 0; min-height: 0; flex-wrap: wrap;
  }
  #assistantWrap .assistant-attach-row:empty { display: none; }

  /* 附件标签 */
  .attach-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px 2px 4px; background: var(--bg-warm);
    border: 1px solid var(--rule); border-radius: 4px;
    font-size: 11px; color: var(--ink-soft); cursor: pointer; transition: all 0.12s;
    line-height: 1.4;
  }
  .attach-pill:hover { border-color: var(--accent); color: var(--accent); }

  .attach-type-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 16px; border-radius: 3px; font-size: 9px;
    font-weight: 600; letter-spacing: 0.02em; padding: 0 4px; flex-shrink: 0;
    font-family: 'JetBrains Mono', monospace; line-height: 1;
  }
  .attach-type-badge.note { background: #dbeafe; color: #1d4ed8; }
  .attach-type-badge.todo { background: #dcfce7; color: #166534; }
  body[data-theme="dark"] .attach-type-badge.note { background: #1e3a5f; color: #93c5fd; }
  body[data-theme="dark"] .attach-type-badge.todo { background: #14532d; color: #86efac; }

  .msg-attachments { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 4px; }
  .msg-attach-pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 2px 8px 2px 4px; background: var(--bg-warm);
    border: 1px solid var(--rule-soft); border-radius: 4px;
    font-size: 10px; color: var(--ink-mute); cursor: default; transition: all 0.12s;
    line-height: 1.4;
  }
  .msg-attach-pill:hover { border-color: var(--accent); color: var(--accent); }

  /* 附件选择器（模态） */
  .attach-picker-bg {
    position: fixed; inset: 0; z-index: 2000;
    background: rgba(26, 24, 20, 0.4); display: none; align-items: center; justify-content: center;
  }
  .attach-picker-bg.show { display: flex; }
  .attach-picker {
    background: var(--paper); border: 1px solid var(--rule); border-radius: 12px;
    box-shadow: var(--shadow-deep); width: 420px; max-width: 92vw; max-height: 70vh;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .attach-picker-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--rule-soft);
  }
  .attach-picker-header h4 { margin: 0; font-size: 15px; }
  .attach-picker-list { flex: 1; overflow-y: auto; padding: 8px; }
  .attach-picker-section { margin-bottom: 12px; }
  .attach-picker-title {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute);
    letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 8px; margin-bottom: 4px;
  }
  .attach-picker-empty { padding: 12px 8px; color: var(--ink-mute); font-style: italic; font-size: 13px; }
  .attach-picker-item {
    padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px;
    color: var(--ink); transition: all 0.12s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .attach-picker-item:hover { background: var(--bg-warm); }
  .attach-picker-item.selected { background: var(--bg-warm); color: var(--accent); font-weight: 500; }

</head>
<body>

<div class="app" id="app">
  <!-- 左侧笔记本侧栏 -->
  <aside class="rail">
    <div class="rail-head">
      <div class="rail-logo" id="railLogo" title="折叠/展开侧栏">M</div>
      <div class="rail-brand">
        Margin<em>ote</em>
        <small>Notebooks</small>
      </div>
    </div>

    <div class="rail-system-items">
        <button class="rail-item active" data-view="all">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h12"/>
          </svg>
          <span class="rail-item-label">全部笔记</span>
          <span class="rail-item-count" id="countAll">0</span>
        </button>
        <button class="rail-item" data-view="todo:all">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          <span class="rail-item-label">全部待办</span>
          <span class="rail-item-count" id="countTodoAll">0</span>
        </button>
        <button class="rail-item" data-view="starred">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499l2.12 4.296 4.74.69-3.43 3.343.81 4.72-4.24-2.23-4.24 2.23.81-4.72L4.62 8.485l4.74-.69L11.48 3.5z"/>
          </svg>
          <span class="rail-item-label">收藏</span>
          <span class="rail-item-count" id="countStarred">0</span>
        </button>
        <button class="rail-item" data-view="trash">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.87 12.14A2 2 0 0116.14 21H7.86a2 2 0 01-1.99-1.86L5 7m5 4v6m4-6v6M3 7h18M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>
          </svg>
          <span class="rail-item-label">回收站</span>
          <span class="rail-item-count" id="countTrash">0</span>
        </button>
      </div>

    <div class="rail-section" id="sectionTodos">
      <div class="rail-section-title" data-toggle="sectionTodos">
        <span class="section-left">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/>
          </svg>
          待办事项
        </span>
        <span class="section-right">
          <button class="add-btn" id="newTodoBtn" title="新建待办">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <svg class="chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </span>
      </div>
      <div class="section-body">
        <button class="rail-item todo-item-rail" data-view="todo:active">
          <span class="todo-status-dot" data-color="#0d9488" style="background-color:#0d9488"></span>
          <span class="rail-item-label">进行中</span>
          <span class="rail-item-count" id="countTodoActive">0</span>
        </button>
        <button class="rail-item todo-item-rail" data-view="todo:done">
          <span class="todo-status-dot" data-color="#8a8275" style="background-color:#8a8275"></span>
          <span class="rail-item-label">已完成</span>
          <span class="rail-item-count" id="countTodoDone">0</span>
        </button>
        <button class="rail-item todo-item-rail" data-view="todo:overdue">
          <span class="todo-status-dot" data-color="#b8431f" style="background-color:#b8431f"></span>
          <span class="rail-item-label">已超期</span>
          <span class="rail-item-count" id="countTodoOverdue">0</span>
        </button>
      </div>
    </div>

    <div class="rail-section" id="sectionNotebooks" style="flex:1; display:flex; flex-direction:column; min-height:0; padding-bottom:0">
      <div class="rail-section-title" data-toggle="sectionNotebooks">
        <span class="section-left">
          <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.25a3.5 3.5 0 013.5 3.5c0 2.72-3.5 6-3.5 6s-3.5-3.28-3.5-6a3.5 3.5 0 013.5-3.5zM4 19.5v-15A2.5 2.5 0 016.5 2H20v20H6.5A2.5 2.5 0 014 19.5z"/></svg>
          笔记本
        </span>
        <span class="section-right">
          <button class="add-btn" id="newNotebookBtn" title="新建笔记本">
            <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
            </svg>
          </button>
          <svg class="chevron" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
        </span>
      </div>
      <div class="section-body rail-notebooks" id="notebooksList"></div>
    </div>

    <div class="rail-foot">
      <button class="theme-toggle rail-item" id="aiAssistantBtn" title="AI 助手">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 12c0 4.4-4 8-9 8a9.4 9.4 0 01-3.5-.7L3 21l1.5-4.3A8.3 8.3 0 013 12c0-4.4 4-8 9-8s9 3.6 9 8z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 11h.01M12 11h.01M15 11h.01"/>
        </svg>
        <span class="rail-item-label">AI 助手</span>
      </button>
      <button class="theme-toggle rail-item" id="settingsBtn" title="设置">
        <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/>
        </svg>
        <span class="rail-item-label">设置</span>
      </button>
    </div>
  </aside>

  <!-- 笔记列表 -->
  <aside class="sidebar">
    <div class="sidebar-head">
      <div class="masthead">
        <div class="masthead-title">
          <span class="nb-dot" id="currentNbDot" style="background-color: var(--ink)"></span>
          <h1 id="currentCollectionName">全部笔记</h1>
        </div>
        <span class="issue-no" id="issueNo">№ 001</span>
      </div>
      <div class="meta-line">
        <span id="todayDate"></span>
        <span class="dot"></span>
        <span id="noteCount">0 篇</span>
      </div>
    </div>

    <div class="search-row">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="7"/>
        <path stroke-linecap="round" d="M21 21l-4.35-4.35"/>
      </svg>
      <input type="text" id="searchInput" placeholder="搜索笔记标题或内容...">
    </div>

    <button class="new-note-btn" id="newNoteBtn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" d="M12 5v14M5 12h14"/>
      </svg>
      新建笔记
    </button>

    <button class="new-note-btn secondary" id="openFileBtn" title="打开本地 .md / .txt / .markdown 文件，编辑后自动写回磁盘">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/>
      </svg>
      打开本地文件
    </button>

    <div class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-tag="all">全部</button>
    </div>

    <div class="list-controls" id="listControls">
      <span>排序</span>
      <select id="sortSelect" aria-label="排序方式">
        <option value="updated">更新时间</option>
        <option value="created">创建时间</option>
        <option value="title">标题</option>
        <option value="words">字数</option>
      </select>
      <button class="compact-toggle" id="compactToggle" aria-label="紧凑模式">紧凑</button>
    </div>

    <div class="notes-list" id="notesList"></div>

    <div class="todo-panel" id="todoPanel">
      <div class="todo-add">
        <input type="text" id="todoTextInput" placeholder="新建待办事项..." maxlength="200">
        <div class="todo-add-row">
          <input type="datetime-local" id="todoDueInput" title="截止时间">
          <button id="todoAddBtn">添加</button>
        </div>
        <div class="remind-preset-row" title="提醒（仅扩展模式有效）">
          <svg width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>
          </svg>
          <select id="todoRemindPreset" aria-label="提醒预设">
            <option value="0">不提醒</option>
            <option value="0-now">准时提醒</option>
            <option value="5">5 分钟前</option>
            <option value="15">15 分钟前</option>
            <option value="30">30 分钟前</option>
            <option value="60">1 小时前</option>
            <option value="180">3 小时前</option>
            <option value="1440">1 天前</option>
            <option value="custom">自定义…</option>
          </select>
          <div class="remind-advanced" id="todoRemindAdv">
            提前 <input type="number" id="todoRemindBefore" min="0" max="10080" step="1" placeholder="0"> 分
            × <input type="number" id="todoRemindCount" min="1" max="20" step="1" value="1"> 次
            / <input type="number" id="todoRemindInterval" min="1" max="1440" step="1" value="5"> 分
          </div>
        </div>
        <div class="ext-only-tip">提醒功能仅在浏览器扩展中可用</div>
      </div>
      <div class="todo-list" id="todoList"></div>
    </div>
  </aside>

  <!-- 编辑器 -->

            </svg>
          </button>
        </div>
      </div>

      <div class="editor-content">
        <input type="text" class="title-input" id="titleInput" placeholder="无题…" maxlength="200">

        <div class="editor-meta">

          <span id="editorDate">—</span>
          <span class="dot"></span>
          <span id="editorStatus">已保存</span>

        <div class="subtitle-row">

      </div>

    <div id="todoEditorWrap" style="display:none">

        <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--ink-mute);letter-spacing:0.05em;text-transform:uppercase">截止：</span>

        <span class="tool-divider"></span>
        <div class="remind-preset-row" style="margin: 0;">
          <svg width="14" height="14" fill="none" stroke="var(--accent)" stroke-width="1.8" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 01-3.4 0"/>

            <option value="5">5 分前</option>
            <option value="15">15 分前</option>
            <option value="30">30 分前</option>
            <option value="60">1 小时前</option>
            <option value="180">3 小时前</option>
            <option value="1440">1 天前</option>
            <option value="custom">自定义…</option>

          <div class="remind-advanced" id="todoEditRemindAdv">

            / <input type="number" id="todoEditRemindInterval" min="1" max="1440" step="1" value="5"> 分

        <div class="editor-actions">
          <button class="icon-btn" id="todoImageBtn" data-tip="插入图片">

              <circle cx="8.5" cy="8.5" r="1.5"/>
              <path stroke-linecap="round" stroke-linejoin="round" d="M21 15l-5-5L5 21"/>
            </svg>
          </button>
          <button class="icon-btn" id="todoPreviewBtn" data-tip="预览">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="icon-btn ai-btn" id="todoAiBtn" data-tip="AI 优化">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 2l2 5 5 2-5 2-2 5-2-5-5-2 5-2 2-5zM18 14l1 2.5 2.5 1-2.5 1L18 21l-1-2.5-2.5-1 2.5-1L18 14z"/>
            </svg>
          </button>
          <button class="icon-btn danger" id="todoEditDeleteBtn" data-tip="删除待办">
            <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.87 12.14A2 2 0 0116.14 21H7.86a2 2 0 01-1.99-1.86L5 7m5 4v6m4-6v6M3 7h18M9 7V4a1 1 0 011-1h4a1 1 0 011 1v3"/>

        </div>
      </div>

      <div class="editor-content">
        <input type="text" class="title-input" id="todoEditTitle" placeholder="待办标题..." maxlength="200">

          <span id="todoEditMeta">—</span>

    <!-- AI 助手内嵌面板 -->

        <p class="settings-section-title">预览</p>
        <div style="padding:14px 16px; background: var(--bg-warm); border:1px solid var(--rule-soft); border-radius: 8px; color: var(--ink); line-height: 1.7;">
          <div style="font-size: 1.2em; font-weight: 600; margin-bottom: 6px;">边注 Marginote</div>
          <div>The quick brown fox jumps over the lazy dog. 落花人独立，微雨燕双飞。</div>
          <div style="margin-top:6px; font-family:'JetBrains Mono', monospace; font-size: 0.85em; color: var(--ink-mute);">function preview() { return 0123456789; }</div>
        </div>
      </div>

      <!-- AI -->
      <div class="settings-pane" data-pane="ai">
        <p style="color: var(--ink-soft); font-size: 13px; margin-bottom: 16px;">配置 OpenAI 兼容的模型接口（DeepSeek / Kimi / OpenAI / GLM / Qwen 等）。所有数据仅保存在本地浏览器。</p>
        <p class="settings-section-title">已配置模型</p>
        <div class="ai-provider-list" id="aiProviderList"></div>
        <div class="ai-add-row">
          <select id="aiPresetSelect"></select>
          <button class="modal-btn primary" id="aiAddBtn">+ 新增</button>
        </div>
        <div class="ai-provider-form" id="aiProviderForm">
          <div class="row">
            <label>名称</label>
            <input type="text" id="aiFormName" placeholder="如：我的 DeepSeek">
          </div>
          <div class="row">
            <label>接口地址 (Endpoint，含 /chat/completions 路径)</label>
            <input type="text" id="aiFormEndpoint" placeholder="https://api.deepseek.com/v1/chat/completions">
          </div>
          <div class="row split">
            <div>
              <label>模型 ID</label>
              <input type="text" id="aiFormModel" placeholder="deepseek-chat">
            </div>
            <div>
              <label>API Key</label>
              <input type="password" id="aiFormKey" placeholder="sk-...">
            </div>
          </div>
          <div class="row">
            <label>代理 URL (可选；留空 = 直连)</label>
            <input type="text" id="aiFormProxy" placeholder="http://user:pass@corp-proxy.com:8080  或  https://corsproxy.io/?{url}">
            <div class="ai-form-hint">
              <strong>HTTP 代理</strong>（含 auth）：<code>http://user:pass@host:port</code> 或 <code>https://...</code> 或 <code>socks5://...</code><br>
              <strong>URL 反代</strong>：含 <code>{url}</code> 占位符或自定义路径<br>
              仅作用于该模型的 endpoint host，其它流量不变
            </div>
          </div>
          <div class="row">
            <label>系统提示词 (可选，作用于本模型)</label>
            <textarea id="aiFormSystem" placeholder="你是简洁实用的中文写作助手，输出保持 Markdown 格式。"></textarea>
          </div>
          <div class="row">
            <label>温度 Temperature (0-2，默认 0.7)</label>
            <input type="number" id="aiFormTemp" min="0" max="2" step="0.1" placeholder="0.7">
          </div>
          <div class="form-actions">
            <button class="modal-btn" id="aiFormCancel">取消</button>
            <button class="modal-btn primary" id="aiFormSave">保存</button>
          </div>
        </div>
        <div style="margin-top: 16px;">
          <button class="modal-btn" id="aiTestBtn">测试当前模型</button>
        </div>
      </div>

      <!-- 数据 · 备份 -->
      <div class="settings-pane" data-pane="data">
        <p style="color: var(--ink-soft); font-size: 13px; margin-bottom: 16px;">所有笔记 / 待办 / 图片 / AI 配置存储在本地。手动「导出 / 导入」请见「导入 · 导出」标签页。</p>
        <p class="settings-section-title">存储信息</p>
        <div class="storage-info" id="storageInfo"></div>
        <p class="settings-section-title">自动备份</p>
        <div class="storage-auto-row">
          <label>每隔多少天自动导出 zip</label>
          <input type="number" id="storageAutoDays" min="0" max="365" step="1" value="0">
          <span class="settings-label-mono">天 (0=关闭)</span>
        </div>
        <div class="settings-label-mono" style="margin-bottom: 16px;">上次备份：<span id="storageLastBackup">从未</span></div>
        <p class="settings-section-title">本地文件夹同步</p>
        <div class="storage-info" id="localSyncInfo" style="margin-bottom:8px;">未连接本地文件夹（数据仅存浏览器）</div>
        <div class="storage-actions" style="grid-template-columns: 1fr 1fr 1fr;">
          <button id="pickDirBtn">📁 选择文件夹</button>
          <button id="syncDiskBtn">⬆ 立即同步</button>
          <button id="restoreDiskBtn">⬇ 从本地恢复</button>
        </div>
        <div class="storage-auto-row">
          <label>变更后自动同步到本地（5 秒节流）</label>
          <input type="checkbox" id="autoSyncToggle" style="width:18px;height:18px;cursor:pointer;accent-color:var(--accent);">
        </div>
        <div class="settings-label-mono" style="margin-bottom: 16px;">仅 Chrome/Edge 100+ 支持。绑定后笔记和图片实时同步到本地文件夹。重装扩展后再选同一文件夹即恢复。</div>
        <p class="settings-section-title" style="display:flex;justify-content:space-between;align-items:center;">
          <span>错误日志 <span id="errorLogCount" style="color:var(--accent);">(0)</span></span>
          <button class="modal-btn" id="errorLogClearBtn" style="padding:4px 10px;font-size:11px;">清空</button>
        </p>
        <div class="error-log-list" id="errorLogList"></div>
      </div>

      <!-- 导入 · 导出 -->
      <div class="settings-pane" data-pane="io">
        <p style="color: var(--ink-soft); font-size: 13px; margin-bottom: 16px;">导出全部笔记 / 待办为 JSON / Markdown / zip；导入支持 .json / .md / .markdown / .zip。导入会与当前数据合并。</p>
        <p class="settings-section-title">操作</p>
        <div class="storage-actions" style="grid-template-columns: 1fr 1fr;">
          <button id="exportBtn">⬆ 导出全部</button>
          <button id="importBtn">⬇ 导入文件</button>
        </div>
        <p class="settings-section-title" style="margin-top:18px;">提示</p>
        <ul style="font-size:13px; color:var(--ink-soft); padding-left: 20px; line-height: 1.8;">
          <li>导出会下载一个含全部数据的 zip（推荐定期备份）。</li>
          <li>导入支持单个 .md / .markdown / .json 或 .zip 备份包，可一次选择多个。</li>
          <li>主题、字体、AI 设置存在「外观」「AI」标签页，独立于数据。</li>
          <li class="desktop-migration-hint" style="display:none;">从 Chrome 扩展迁移：先在扩展里点「导出全部」下载 zip，再在桌面版这里点「导入文件」选中。</li>
        </ul>
      </div>

      <!-- 桌面（仅桌面版可见，由 body.is-desktop 控制）-->
      <div class="settings-pane desktop-only" data-pane="desktop">
        <p style="color: var(--ink-soft); font-size: 13px; margin-bottom: 16px;">仅桌面版可用的能力。</p>

        <p class="settings-section-title">开机自启</p>
        <div style="display:flex; align-items:center; gap:12px;">
          <label class="switch-row" style="display:flex; align-items:center; gap:8px; cursor:pointer;">
            <input type="checkbox" id="desktopAutostart" />
            <span>登录 Windows 后自动启动 Marginote 到托盘</span>
          </label>
        </div>

        <p class="settings-section-title" style="margin-top:18px;">全局快捷键</p>
        <p style="color: var(--ink-soft); font-size: 12px; margin: 0 0 8px;">从任何窗口唤起 Marginote。格式形如 <code>Ctrl+Shift+M</code>、<code>Alt+Space</code>。</p>
        <div style="display:flex; gap:8px; align-items:center;">
          <input type="text" id="desktopHotkey" value="Ctrl+Shift+M" style="flex:1; padding:6px 10px; font-family: 'JetBrains Mono', monospace;" />
          <button class="modal-btn" id="desktopHotkeySave">应用</button>
        </div>
        <p id="desktopHotkeyStatus" style="color: var(--ink-soft); font-size: 12px; margin-top: 6px; min-height: 16px;"></p>

        <p class="settings-section-title" style="margin-top:18px;">关闭行为</p>
        <p style="color: var(--ink-soft); font-size: 13px; line-height: 1.7;">
          点击窗口右上角 <strong>×</strong> 不会退出，而是隐藏到系统托盘。要真正退出请点托盘菜单的「退出 Marginote」。
        </p>

        <p class="settings-section-title" style="margin-top:18px;">数据迁移</p>
        <p style="color: var(--ink-soft); font-size: 13px; line-height: 1.7;">
          从 Chrome 扩展迁移：在扩展里点「导出全部」下载 zip → 来这里的「导入 · 导出」标签页点「导入文件」选择该 zip，笔记 / 待办 / 图片 / 历史版本会完整恢复。
        </p>
      </div>

    </div>
    <div class="settings-footer">
      <button class="modal-btn primary" id="settingsModalClose">完成</button>
    </div>
  </div>
</div>

<!-- 附件选择器 -->
<div class="attach-picker-bg" id="attachmentPickerBg">
  <div class="attach-picker">
    <div class="attach-picker-header">
      <h4>选择笔记或待办附加到对话</h4>
      <button class="settings-close-x" id="attachmentPickerClose" aria-label="关闭" style="position:static;">×</button>
    </div>
    <div class="attach-picker-list" id="attachmentPickerList"></div>
  </div>
</div>

<!-- 移动到笔记本浮层 -->
<div id="moveMenu" style="position:fixed; display:none; background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow-deep); padding: 6px; z-index: 1000; min-width: 200px; max-height: 320px; overflow-y: auto;"></div>

<!-- AI 操作菜单 -->
<div class="ai-menu" id="aiMenu"></div>

<!-- 历史版本模态框 -->
<div class="modal-bg" id="versionModalBg">
  <div class="modal" style="max-width: 880px; width: 90vw; max-height: 88vh; display:flex; flex-direction:column;">
    <h3 style="margin-bottom:6px;">历史版本 <span id="versionNoteTitle" style="font-weight:normal;color:var(--ink-mute);font-size:13px;margin-left:6px;"></span></h3>
    <p style="color: var(--ink-soft); font-size: 12px; margin-bottom: 12px;">编辑保存自动记录，每篇最多保留 20 个自动版本（命名版本不淘汰）。</p>
    <div style="display:flex; gap:14px; flex:1; min-height:380px; max-height:60vh;">
      <div id="versionList" style="width:280px; overflow-y:auto; border:1px solid var(--rule); border-radius:6px; padding:6px;"></div>
      <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
        <div id="versionPreviewMeta" style="font-size:11px; color:var(--ink-mute); margin-bottom:6px; font-family:'JetBrains Mono',monospace;"></div>
        <div id="versionPreviewTitle" style="font-weight:600; margin-bottom:6px; word-break:break-word;"></div>
        <pre id="versionPreviewContent" style="flex:1; overflow:auto; background:var(--paper); border:1px solid var(--rule); border-radius:6px; padding:10px; white-space:pre-wrap; word-break:break-word; font-family:'JetBrains Mono',monospace; font-size:12px; margin:0;"></pre>
      </div>
    </div>
    <div class="modal-actions" style="margin-top: 14px;">
      <button class="modal-btn" id="versionSnapBtn">保存当前为版本</button>
      <button class="modal-btn" id="versionModalClose">关闭</button>
      <button class="modal-btn primary" id="versionRestoreBtn" disabled>恢复到此版本</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept=".json,.md,.markdown,.zip" style="display:none" multiple>

<!-- 大纲面板 -->
<aside class="outline-panel" id="outlinePanel" aria-label="大纲">
  <button class="outline-close" id="outlineClose" aria-label="关闭大纲" data-tip="关闭">×</button>
  <h4>大纲</h4>
  <div id="outlineList"></div>
</aside>

<!-- 阅读模式退出按钮 + 进度条 -->
<button class="reading-exit-btn" id="readingExitBtn" aria-label="退出阅读模式">
  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" d="M18 6L6 18M6 6l12 12"/>
  </svg>
</button>
<div class="reading-progress" id="readingProgress"></div>

<!-- AI 流式取消按钮 -->
<button class="ai-cancel-btn" id="aiCancelBtn">
  <span class="ai-spinner"></span> AI 生成中… 点击取消
</button>

<!-- AI 自定义指令模态框 -->
<div class="modal-bg" id="aiCustomModalBg">
  <div class="modal ai-custom-modal" style="max-width: 540px;">
    <h3>AI 自定义指令</h3>
    <p style="color: var(--ink-soft); font-size: 13px; margin-bottom: 12px;">输入对当前内容的指令，AI 会按指令处理后替换原文。</p>
    <textarea id="aiCustomInput" placeholder="例如：把这段改写成更精炼的对话风格"></textarea>
    <p style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-mute); letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 6px;">最近使用</p>
    <div class="ai-history-list" id="aiHistoryList"></div>
    <div class="modal-actions">
      <button class="modal-btn" id="aiCustomCancel">取消</button>
      <button class="modal-btn primary" id="aiCustomRun">应用</button>
    </div>
  </div>
</div>

<!-- 移动端汉堡 + 底部 tab -->
<button class="mobile-fab" id="mobileFab" aria-label="切换侧栏">
  <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
    <path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16"/>
  </svg>
</button>

<nav class="mobile-tabs" id="mobileTabs" aria-label="移动端导航">
  <button data-mtab="notes" class="active">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" d="M4 6h16M4 12h16M4 18h12"/></svg>
    笔记
  </button>
  <button data-mtab="todos">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    待办
  </button>
  <button data-mtab="theme">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
    主题
  </button>
  <button data-mtab="settings">
    <svg fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path stroke-linecap="round" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 01-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 008 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H2a2 2 0 010-4h.09A1.65 1.65 0 003.6 8a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06a1.65 1.65 0 001.82.33H8a1.65 1.65 0 001-1.51V2a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V8a1.65 1.65 0 001.51 1H22a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    设置
  </button>
</nav>
<input type="file" id="imageFileInput" accept="image/*" style="display:none">

<script src="js/appearance.js"></script>
<script src="app.js"></script>
<script src="js/assistant.js"></script>
</body>
</html>
